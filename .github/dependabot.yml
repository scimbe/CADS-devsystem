version: 2
updates:
  # pipeline/'s real crates.io dependencies (ed25519-dalek, serde, serde_json) plus
  # the ct-common git dependency (tag-pinned) -- now that pipeline-ci.yml actually
  # verifies every push, dependency bumps get a real CI signal instead of only
  # being caught the next time someone runs cargo test by hand.
  - package-ecosystem: "cargo"
    directory: "/pipeline"
    schedule:
      interval: "weekly"

  # web/'s real dependencies (axum, tower-http, tokio, serde_json, the same
  # ct-common git dep) -- same class of gap /pipeline had until this file existed.
  # Now that pipeline-ci.yml's `web` job actually builds the crate AND the real
  # Dockerfile image (#382), a bump here gets a genuine CI signal, not just
  # caught the next time someone manually rebuilds the deployed container.
  - package-ecosystem: "cargo"
    directory: "/web"
    schedule:
      interval: "weekly"

  # GitHub Actions versions used by pipeline-ci.yml itself.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
