name: Pipeline CI

# Real continuous verification for the pipeline crate -- the actual mechanism
# driving every real iteration/check-in this whole effort. Had no CI at all until
# now, unlike CADS-webconference-android's; same class of gap, same fix. Matches
# this project's own hermetic-gate discipline: -D warnings, real tests, no
# `cargo build` alone counted as "passing".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - name: cargo test (pipeline crate)
        working-directory: pipeline
        run: cargo test --all-targets --verbose

  web:
    # web/ (the real GUI backend, #382) had no CI either -- same class of gap as
    # pipeline/ had until the job above. It's a path-dependent consumer of
    # pipeline/, not tested by the job above at all.
    #
    # Real, honest gap this job had until now, caught while driving
    # CADS-devsystem#7: this job only ever ran `cargo build`, never
    # `cargo test` -- every "N/N tests pass" claim across that issue/PR was
    # true locally but never actually verified in CI. Fixed here alongside
    # adding the real Postgres+pgvector service the RAG semantic-search work
    # needs, rather than leaving that gap open a third time.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      # Real pgvector-enabled Postgres, not plain postgres -- the RAG
      # vector_store tests run `CREATE EXTENSION IF NOT EXISTS vector` as
      # part of their real migration, which a stock postgres image can't
      # satisfy.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/web_ci
      RAG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/web_ci
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: web_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      # Real gap found+fixed 2026-08-05: this ran `cargo build`, not `cargo
      # test` -- directly violating this workflow's OWN stated principle two
      # comment blocks above ("no `cargo build` alone counted as passing").
      # web/'s 90+ real hermetic tests (owner-scoping, requirement
      # validation, proposal approve/reject, the auction endpoints, ...)
      # were never actually run by real CI on push/PR -- a genuine
      # regression to any of them would have compiled clean and shown green
      # here regardless. `cargo test --all-targets` builds AND tests, same
      # as the pipeline job above.
      - name: cargo test (web crate)
        working-directory: web
        run: cargo test --all-targets --verbose

      - name: cargo test (web crate, real hermetic tests -- mocked embedding/Unstructured servers, no real external API calls)
        working-directory: web
        run: cargo test --all-targets --verbose

      - name: cargo test --ignored (real Postgres+pgvector integration tests, against the real service above)
        working-directory: web
        run: cargo test --all-targets --verbose -- --ignored

      - name: docker build (the actual image deployed live behind devsystem-demo.bunsenbrenner.org)
        run: docker build -f web/Dockerfile -t devsystem-web:ci .
