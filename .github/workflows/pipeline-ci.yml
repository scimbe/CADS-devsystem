name: Pipeline CI

# Real continuous verification for the pipeline crate -- the actual mechanism
# driving every real iteration/check-in this whole effort. Had no CI at all until
# now, unlike CADS-webconference-android's; same class of gap, same fix. Matches
# this project's own hermetic-gate discipline: -D warnings, real tests, no
# `cargo build` alone counted as "passing".
#
# Real gap found live by the stress test, twenty-ninth run, 2026-08-06: the
# goal doc's own §5 quality-bar table names "Kunstgerecht" (idiomatic to the
# language/framework, not just "works") as a row with no mechanical check at
# all -- `RUSTFLAGS: -D warnings` catches compiler warnings, a genuinely
# different, narrower layer than clippy's own idiomatic-Rust lints. Checked
# hermetically: `cargo clippy --all-targets -- -D warnings` found 9 real,
# small findings across both crates (a doc-comment formatting quirk, a manual
# reimplementation of `is_multiple_of`, two unnecessary clones creating a
# slice from a reference, an overly complex test-helper return type, a
# drain-then-extend that should have been `append`, three `sort_by` calls
# that should have been `sort_by_key` with `Reverse`) -- all fixed in the
# same real commit that added this step, not left for a future PR to trip
# over.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Real gap found live 2026-08-06: this project's own goal-driven loop pushes to
# main every few minutes, and each push's real CI run takes ~7 minutes (the `web`
# job builds+tests+docker-builds+runs the live stress harness) -- with no
# concurrency group, four separate runs were genuinely stacked in-progress at
# once, none of them cancelled, only the LAST one's result actually mattering for
# main's real current health. Standard GitHub Actions practice for exactly this
# shape: a new push to the same ref cancels its own branch's still-running CI
# rather than letting superseded runs finish redundantly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real gap found live 2026-08-06, investigating §5's own quality-bar table
  # ("Anerkannte Regeln der Technik" row): it claimed partial coverage via
  # "check-no-secrets.sh, the hermetic gate" -- but no such script, hook, or CI
  # job had ever actually existed in THIS repo (that was a different project's
  # convention, referenced but never built here). A real public repo with real
  # credential-shaped env vars (DEVSYSTEM_GITHUB_TOKEN, CT_CHANNEL_NOISE_KEY/
  # HOLDER_KEY, RAG_EMBEDDING_API_KEY, ...) had nothing scanning for one
  # accidentally landing in a commit. Its own dedicated job, not folded into
  # `test` below: no Rust toolchain needed, so it's fast and fails independently
  # of a real compile/test problem.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check for committed secrets (scripts/check-no-secrets.sh)
        run: sh scripts/check-no-secrets.sh

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - name: cargo clippy (pipeline crate -- idiomatic-Rust gate, goal doc §5 "Kunstgerecht")
        working-directory: pipeline
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (pipeline crate)
        working-directory: pipeline
        run: cargo test --all-targets --verbose

  web:
    # web/ (the real GUI backend, #382) had no CI either -- same class of gap as
    # pipeline/ had until the job above. It's a path-dependent consumer of
    # pipeline/, not tested by the job above at all.
    #
    # Real, honest gap this job had until now, caught while driving
    # CADS-devsystem#7: this job only ever ran `cargo build`, never
    # `cargo test` -- every "N/N tests pass" claim across that issue/PR was
    # true locally but never actually verified in CI. Fixed here alongside
    # adding the real Postgres+pgvector service the RAG semantic-search work
    # needs, rather than leaving that gap open a third time.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      # Real pgvector-enabled Postgres, not plain postgres -- the RAG
      # vector_store tests run `CREATE EXTENSION IF NOT EXISTS vector` as
      # part of their real migration, which a stock postgres image can't
      # satisfy.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/web_ci
      RAG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/web_ci
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: web_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: cargo clippy (web crate -- idiomatic-Rust gate, goal doc §5 "Kunstgerecht")
        working-directory: web
        run: cargo clippy --all-targets -- -D warnings

      # Real gap found+fixed 2026-08-05: this ran `cargo build`, not `cargo
      # test` -- directly violating this workflow's OWN stated principle two
      # comment blocks above ("no `cargo build` alone counted as passing").
      # web/'s 90+ real hermetic tests (owner-scoping, requirement
      # validation, proposal approve/reject, the auction endpoints, ...)
      # were never actually run by real CI on push/PR -- a genuine
      # regression to any of them would have compiled clean and shown green
      # here regardless. `cargo test --all-targets` builds AND tests, same
      # as the pipeline job above.
      - name: cargo test (web crate)
        working-directory: web
        run: cargo test --all-targets --verbose

      - name: cargo test (web crate, real hermetic tests -- mocked embedding/Unstructured servers, no real external API calls)
        working-directory: web
        run: cargo test --all-targets --verbose

      - name: cargo test --ignored (real Postgres+pgvector integration tests, against the real service above)
        working-directory: web
        run: cargo test --all-targets --verbose -- --ignored

      - name: docker build (the actual image deployed live behind devsystem-demo.bunsenbrenner.org)
        run: docker build -f web/Dockerfile -t devsystem-web:ci .

      # Real gap closed 2026-08-06 (#382 goal doc §8, stress-test run 35 -> 36):
      # scripts/incompetent-agent-stress-test.sh existed as a real, live-verified
      # tool a human had to remember to run by hand -- exactly the "soft,
      # ignorable" pattern this project's own governing principle exists to
      # close everywhere else. Runs it for real against the actual image built
      # above (not a mock, not the hermetic cargo tests -- a genuine live HTTP
      # regression guard for the real lazy-shortcut gaps this session already
      # found and fixed), so a future PR that reintroduces one of them fails CI
      # instead of waiting for the next manual stress-test firing to notice.
      - name: incompetent-agent stress test (real regression guard, #382 goal doc §8)
        run: |
          docker run -d --name devsystem-web-ci -p 8790:8790 devsystem-web:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8790/api/runs > /dev/null; then break; fi
            sleep 1
          done
          chmod +x scripts/incompetent-agent-stress-test.sh
          scripts/incompetent-agent-stress-test.sh http://127.0.0.1:8790

      - name: incompetent-agent stress test -- container logs (always shown, for debugging a real failure above)
        if: always()
        run: docker logs devsystem-web-ci || true

      - name: incompetent-agent stress test -- stop the real container
        if: always()
        run: docker stop devsystem-web-ci || true
