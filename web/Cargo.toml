[package]
name = "devsystem-web"
version = "0.1.0"
edition = "2021"
description = "Real interactive control surface for The Development System's pipeline runs (#382) -- lists runs, shows live spec/history, and lets a human submit a real iteration/proposal through the browser instead of only via CLI. Every request goes through the exact same devsystem-pipeline library functions the CLI tools use -- no separate logic path."

[[bin]]
name = "devsystem-web"
path = "src/main.rs"

[dependencies]
# Direct dep again (was removed earlier when genuinely unused -- see #382 history
# for the Dependabot false-downgrade that motivated removing it then). Now
# genuinely needed: the real offer-collection endpoints construct/verify
# ct_common::channel::CapacityOffer and run ct_common::pipeline's real
# auction_view directly, not just via devsystem-pipeline's re-exports. Pinned to
# the exact same tag devsystem-pipeline uses so both crates always agree on the
# wire-compatible CapacityOffer/PipelineSpec shapes.
ct-common = { git = "https://github.com/scimbe/CADS-Tunnel", tag = "v0.4.13" }
devsystem-pipeline = { path = "../pipeline" }
# "multipart" for POST /api/runs/{id}/rag/upload-file -- the operator's real
# image/document upload endpoint accepts a real multipart file, not JSON.
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "process" added for #48 slice 6: approve_issue_proposal now shells out to a
# real github_issue_channel_client subprocess (relaying through the isolated
# github_issue_channel_handler agent over a real channel) when that's
# configured, instead of always POSTing to GitHub directly with this process's
# own token -- async spawn/await via tokio::process::Command, not a blocking
# std::process::Command call inside this axum handler.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process"] }
tower-http = { version = "0.7", features = ["fs"] }
# Proxies /api/runs/{id}/assistant to the real devsystem_assistant --serve bridge
# (a separate process, possibly a separate host -- "every component should be
# runnable on a different host" per operator direction). Async client, not the
# pipeline crate's blocking one: this runs inside axum's tokio runtime.
# "multipart" added for rag::parse_with_unstructured -- the Unstructured API's
# /general/v0/general endpoint takes a real multipart/form-data file upload,
# not JSON (CADS-devsystem#7).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# Real, not a dev-only fixture anymore: /api/runs/{id}/offers/quick-submit signs
# a real CapacityOffer server-side with a fresh, ephemeral, real ed25519 key per
# submission -- the browser-driven equivalent of running `devsystem_offer
# --seed N` by hand, so a human can bid a role from the GUI, not just the CLI.
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.8"
# Real Postgres+pgvector storage for RAG semantic search (CADS-devsystem#7,
# operator-directed switch from the earlier embedded-only approach --
# rustls to match every other TLS dep in this crate, not the default
# native-tls). Pinned to 0.9 (not 0.8) to match the sqlx-core version
# pgvector 0.4's own "sqlx" feature actually pulls in -- 0.8 resolved a
# genuinely duplicate sqlx-core in the dependency tree, a real build error
# (pgvector::Vector implementing Encode/Type against the 0.9 sqlx-core,
# every query in this module binding against the 0.8 one), not a style choice.
# sqlx 0.9 split the old combined "runtime-tokio-rustls" feature into
# separate runtime/tls flags -- "runtime-tokio" + "tls-rustls", matching
# every other rustls-backed dep in this crate.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
# sqlx integration for pgvector's `vector` column type -- real typed
# encode/decode, not hand-rolled SQL string formatting of a Vec<f32>.
pgvector = { version = "0.4", features = ["sqlx"] }
# Real per-run build artifacts (issue #36): a real SHA-256 of the actual
# uploaded bytes, computed server-side -- never trusted from a client-supplied
# value, the same discipline every other real provenance field in this crate
# already follows. Already resolved transitively in this workspace's lock file
# (ed25519-dalek/reqwest's own dependency tree); pinned here as a direct dep
# since this crate now calls it directly, not just through another crate's API.
sha2 = "0.10"

[dev-dependencies]
# Drives the real `api_router()` in-process via `ServiceExt::oneshot` -- no network
# socket, no fixture data, exercises the exact handlers `main()` serves.
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
