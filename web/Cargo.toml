[package]
name = "devsystem-web"
version = "0.1.0"
edition = "2021"
description = "Real interactive control surface for The Development System's pipeline runs (#382) -- lists runs, shows live spec/history, and lets a human submit a real iteration/proposal through the browser instead of only via CLI. Every request goes through the exact same devsystem-pipeline library functions the CLI tools use -- no separate logic path."

[[bin]]
name = "devsystem-web"
path = "src/main.rs"

[dependencies]
# Direct dep again (was removed earlier when genuinely unused -- see #382 history
# for the Dependabot false-downgrade that motivated removing it then). Now
# genuinely needed: the real offer-collection endpoints construct/verify
# ct_common::channel::CapacityOffer and run ct_common::pipeline's real
# auction_view directly, not just via devsystem-pipeline's re-exports. Pinned to
# the exact same tag devsystem-pipeline uses so both crates always agree on the
# wire-compatible CapacityOffer/PipelineSpec shapes.
ct-common = { git = "https://github.com/scimbe/CADS-Tunnel", tag = "v0.4.13" }
devsystem-pipeline = { path = "../pipeline" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tower-http = { version = "0.7", features = ["fs"] }
# Proxies /api/runs/{id}/assistant to the real devsystem_assistant --serve bridge
# (a separate process, possibly a separate host -- "every component should be
# runnable on a different host" per operator direction). Async client, not the
# pipeline crate's blocking one: this runs inside axum's tokio runtime.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Real, not a dev-only fixture anymore: /api/runs/{id}/offers/quick-submit signs
# a real CapacityOffer server-side with a fresh, ephemeral, real ed25519 key per
# submission -- the browser-driven equivalent of running `devsystem_offer
# --seed N` by hand, so a human can bid a role from the GUI, not just the CLI.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[dev-dependencies]
# Drives the real `api_router()` in-process via `ServiceExt::oneshot` -- no network
# socket, no fixture data, exercises the exact handlers `main()` serves.
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
