<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Development System -- control panel</title>
<style>
 :root{--bg:#0d1117;--panel:#141b24;--border:#242c38;--text:#e6edf3;--muted:#8b949e;
       --accent:#d98a4f;--accent-ink:#20130a;--accent2:#5fb8ab;--danger:#e5534b;
       --mono:ui-monospace,"SF Mono",Consolas,monospace;--serif:ui-serif,Georgia,serif}
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);line-height:1.5;overflow:hidden}
 .topbar{display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;border-bottom:1px solid var(--border);
         background:var(--panel);flex-wrap:wrap}
 .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
 .topbar h1{font-size:1.05rem;margin:0;white-space:nowrap}
 .lede{color:var(--muted);max-width:60ch}
 .panel-toggles{display:flex;flex-wrap:wrap;gap:.35rem;flex:1}
 .panel-chip{font-family:var(--mono);font-size:.7rem;background:transparent;border:1px solid var(--border);
             color:var(--muted);border-radius:5px;padding:.2rem .55rem;cursor:pointer;font-weight:400}
 .panel-chip.active{border-color:var(--accent2);color:var(--accent2)}
 .topbar-links{font-size:.72rem;color:var(--muted);white-space:nowrap}
 .topbar-links a{color:var(--accent2)}
 #desktop{position:relative;width:100%;height:calc(100vh - 48px);overflow:auto}
 .win{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:10px;
      box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;min-width:220px;min-height:140px}
 .win-header{cursor:move;display:flex;justify-content:space-between;align-items:center;
             padding:.4rem .6rem;border-bottom:1px solid var(--border);font-family:var(--mono);
             font-size:.72rem;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;
             border-radius:10px 10px 0 0;user-select:none}
 .win-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:1rem;
            line-height:1;padding:0 .2rem;font-weight:400}
 .win-close:hover{color:var(--danger)}
 .win-body{padding:.8rem;overflow:auto;flex:1;font-size:.85rem}
 .win-resize{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;
             border-right:2px solid var(--border);border-bottom:2px solid var(--border)}
 h2{font-size:.95rem;margin:0 0 .6rem;font-family:var(--mono)}
 .runs{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.8rem}
 .run-item{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--border);
           border-radius:8px;padding:.6rem .8rem;color:var(--text);cursor:pointer;font-family:var(--mono);font-size:.85rem}
 .run-item:hover{border-color:var(--accent)}
 .run-item.active{border-color:var(--accent2);background:rgba(95,184,171,.08)}
 .run-item .meta{color:var(--muted);font-size:.75rem;margin-top:.2rem}
 .stalled-badge{float:right;font-size:.68rem;color:var(--accent);border:1px solid var(--accent);
                border-radius:5px;padding:.05rem .35rem;font-weight:700}
 .attention-badge{float:right;font-size:.68rem;color:var(--danger);border:1px solid var(--danger);
                border-radius:5px;padding:.05rem .35rem;font-weight:700;margin-left:.3rem}
 .risk-badge{float:right;font-size:.68rem;color:var(--danger);border:1px solid var(--danger);
                border-radius:5px;padding:.05rem .35rem;font-weight:700}
 .health{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem;font-family:var(--mono);font-size:.75rem}
 .health .stat{border:1px solid var(--border);border-radius:6px;padding:.3rem .55rem;color:var(--muted)}
 .health .stat b{color:var(--text)}
 .health .stat.warn{border-color:var(--accent);color:var(--accent)}
 .health .stat.warn b{color:var(--accent)}
 .health .stat.danger{border-color:var(--danger);color:var(--danger)}
 .health .stat.danger b{color:var(--danger)}
 details.criteria{font-size:.85rem}
 details.criteria summary{cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:.75rem}
 .criteria-fields{display:flex;gap:.6rem;margin-top:.5rem;flex-wrap:wrap}
 .criteria-fields label{flex:1;min-width:8rem;margin:0}
 .criteria-fields input{margin-top:.25rem}
 .risk-panel,.stalled-panel{padding:.6rem .8rem;border-radius:8px;font-size:.85rem}
 .risk-panel{border:1px solid var(--danger);background:rgba(229,83,75,.08);margin-bottom:.6rem}
 .risk-panel .title{font-family:var(--mono);font-size:.75rem;color:var(--danger);font-weight:700;margin-bottom:.3rem}
 .risk-item{margin-top:.3rem}
 .risk-item b{color:var(--danger)}
 .stalled-panel{border:1px solid var(--accent);background:rgba(217,138,79,.08)}
 .stalled-panel .title{font-family:var(--mono);font-size:.75rem;color:var(--accent);font-weight:700;margin-bottom:.3rem}
 form.inline{display:flex;gap:.4rem}
 input,textarea,select{background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text);
        padding:.45rem .6rem;font-family:var(--mono);font-size:.85rem;width:100%}
 textarea{min-height:5rem;resize:vertical}
 label{display:block;font-size:.78rem;color:var(--muted);margin:.7rem 0 .25rem;font-family:var(--mono)}
 button{background:var(--accent);color:var(--accent-ink);border:none;border-radius:6px;padding:.5rem .9rem;
        font-weight:700;font-family:var(--mono);font-size:.82rem;cursor:pointer}
 button:hover{filter:brightness(1.08)}
 button.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
 .role{font-family:var(--mono);font-size:.75rem;background:rgba(95,184,171,.12);color:var(--accent2);
       border-radius:5px;padding:.15rem .5rem}
 button.stalled-fill{border:1px solid var(--accent);background:rgba(217,138,79,.12);color:var(--accent);
       cursor:pointer}
 button.stalled-fill:hover{background:rgba(217,138,79,.22)}
 .role-card{border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;margin-bottom:.5rem}
 .role-card-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.3rem;margin-bottom:.35rem}
 .role-meta{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
 .role-latest{font-size:.8rem;padding-left:.5rem;border-left:2px solid var(--border)}
 .role-latest.ok{border-left-color:var(--accent2)}
 .role-latest.fail{border-left-color:var(--danger)}
 .role-count{font-size:.7rem;margin-top:.2rem}
 .history{display:flex;flex-direction:column;gap:.6rem}
 .iter{border:1px solid var(--border);border-radius:8px;padding:.65rem .8rem;font-size:.85rem}
 .iter .head{font-family:var(--mono);font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between}
 .proposal{margin-top:.5rem;padding:.4rem .6rem;border-left:2px solid var(--accent);background:rgba(217,138,79,.06);
           border-radius:0 6px 6px 0}
 .proposal-head{font-family:var(--mono);font-size:.75rem;color:var(--accent)}
 .proposal-rationale{font-size:.8rem;color:var(--muted);margin-top:.15rem}
 .ok{color:var(--accent2)}
 .fail{color:var(--danger)}
 .status-line{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-top:.6rem;min-height:1.2em}
 .status-line.ok{color:var(--accent2)}
 .status-line.err{color:var(--danger)}
 .status-line.warn{color:var(--accent);font-weight:700}
 pre.checkin{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:#0d1117;
             border:1px solid var(--border);border-radius:8px;padding:1rem;overflow:auto}
 .memory-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}
 .mem-entry{border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-size:.82rem}
 .mem-entry .head{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:.3rem}
 .mem-entry .trust{border-radius:5px;padding:.05rem .35rem;font-size:.68rem;font-weight:700}
 .mem-entry .trust.unreviewed{color:var(--accent);border:1px solid var(--accent)}
 .mem-entry .trust.governed{color:var(--accent2);border:1px solid var(--accent2)}
 .mem-entry ul{margin:.2rem 0 0;padding-left:1.1rem}
 code{background:#0d1117;border:1px solid var(--border);border-radius:5px;padding:.1rem .35rem;font-size:.9em;font-family:var(--mono)}
</style>
</head>
<body>
<div class="topbar">
 <div>
  <div class="eyebrow">CADS-Tunnel #382 · live control panel</div>
  <h1>The Development System</h1>
 </div>
 <div id="panel-toggles" class="panel-toggles"></div>
 <div class="topbar-links">
  <a href="https://github.com/scimbe/CADS-devsystem">repo</a> ·
  <a href="https://github.com/scimbe/CADS-Tunnel/issues/382">#382</a>
 </div>
</div>
<div id="desktop"></div>

<script>
const API = '/api';
let currentRun = null;
let currentRunData = null;
let criteriaOpen = false;

// -------------------- panel/dock system --------------------
// Every functional area is its own window: draggable by its header, resizable
// from the bottom-right corner, individually hideable/showable via the top
// toggle bar, and its rect+visibility persists in localStorage so a human's
// arrangement survives a reload. Deliberately no external layout library --
// this repo's whole frontend stays vanilla JS/CSS, no build step.
const PANEL_DEFAULTS = {
  runs:       { title: 'Runs',              x: 16,   y: 16,  w: 280, h: 420 },
  roles:      { title: 'Roles',              x: 312,  y: 16,  w: 400, h: 300 },
  healthcrit: { title: 'Health & Criteria',  x: 728,  y: 16,  w: 320, h: 300 },
  risks:      { title: 'Risks & Stalled',    x: 312,  y: 332, w: 400, h: 240 },
  newiter:    { title: 'New Iteration',      x: 1064, y: 16,  w: 340, h: 556 },
  history:    { title: 'History',            x: 728,  y: 332, w: 320, h: 480 },
  checkin:    { title: 'Check-in',           x: 16,   y: 452, w: 280, h: 300 },
  memory:     { title: 'Memory Log',         x: 1420, y: 16,  w: 380, h: 556 },
};

const LAYOUT_KEY = 'devsystem-panel-layout-v1';
let layout = {};
try { layout = JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'); } catch (e) { layout = {}; }
let zTop = 10;

function saveLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) { /* storage unavailable -- layout just won't persist */ }
}

function panelRect(id) {
  const d = PANEL_DEFAULTS[id];
  const saved = layout[id] || {};
  return {
    x: saved.x ?? d.x, y: saved.y ?? d.y, w: saved.w ?? d.w, h: saved.h ?? d.h,
    visible: saved.visible ?? true, z: saved.z ?? (zTop++),
  };
}

function createPanel(id) {
  const d = PANEL_DEFAULTS[id];
  const r = panelRect(id);
  const win = document.createElement('div');
  win.className = 'win';
  win.id = `win-${id}`;
  win.style.left = r.x + 'px';
  win.style.top = r.y + 'px';
  win.style.width = r.w + 'px';
  win.style.height = r.h + 'px';
  win.style.zIndex = r.z;
  win.style.display = r.visible ? 'flex' : 'none';
  win.innerHTML = `
    <div class="win-header" data-panel="${id}">
      <span>${d.title}</span>
      <button type="button" class="win-close" data-panel="${id}" title="Hide">×</button>
    </div>
    <div class="win-body" id="body-${id}"></div>
    <div class="win-resize" data-panel="${id}"></div>
  `;
  document.getElementById('desktop').appendChild(win);
  wireDrag(win, id);
  wireResize(win, id);
  win.addEventListener('mousedown', () => bringToFront(id));
  win.querySelector('.win-close').onclick = (e) => { e.stopPropagation(); hidePanel(id); };
  return win;
}

function bringToFront(id) {
  const win = document.getElementById(`win-${id}`);
  zTop += 1;
  win.style.zIndex = zTop;
  layout[id] = { ...panelRect(id), z: zTop };
  saveLayout();
}

function hidePanel(id) {
  document.getElementById(`win-${id}`).style.display = 'none';
  layout[id] = { ...panelRect(id), visible: false };
  saveLayout();
  renderPanelToggleBar();
}

function showPanel(id) {
  const win = document.getElementById(`win-${id}`);
  win.style.display = 'flex';
  layout[id] = { ...panelRect(id), visible: true };
  saveLayout();
  bringToFront(id);
  renderPanelToggleBar();
}

function wireDrag(win, id) {
  const header = win.querySelector('.win-header');
  header.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('win-close')) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startLeft = win.offsetLeft, startTop = win.offsetTop;
    function onMove(ev) {
      win.style.left = Math.max(0, startLeft + ev.clientX - startX) + 'px';
      win.style.top = Math.max(0, startTop + ev.clientY - startY) + 'px';
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      layout[id] = { ...panelRect(id), x: win.offsetLeft, y: win.offsetTop };
      saveLayout();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function wireResize(win, id) {
  const handle = win.querySelector('.win-resize');
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault(); e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const startW = win.offsetWidth, startH = win.offsetHeight;
    function onMove(ev) {
      win.style.width = Math.max(220, startW + ev.clientX - startX) + 'px';
      win.style.height = Math.max(140, startH + ev.clientY - startY) + 'px';
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      layout[id] = { ...panelRect(id), w: win.offsetWidth, h: win.offsetHeight };
      saveLayout();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function renderPanelToggleBar() {
  const bar = document.getElementById('panel-toggles');
  bar.innerHTML = Object.keys(PANEL_DEFAULTS).map(id => {
    const visible = panelRect(id).visible;
    return `<button type="button" class="panel-chip${visible ? ' active' : ''}" data-panel="${id}">${PANEL_DEFAULTS[id].title}</button>`;
  }).join('');
  for (const btn of bar.querySelectorAll('.panel-chip')) {
    btn.onclick = () => {
      const id = btn.dataset.panel;
      if (panelRect(id).visible) hidePanel(id); else showPanel(id);
    };
  }
}

function initPanels() {
  for (const id of Object.keys(PANEL_DEFAULTS)) createPanel(id);
  renderPanelToggleBar();
}

// -------------------- data + rendering --------------------

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && (body.error || JSON.stringify(body))) || res.statusText);
  return body;
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

async function loadRuns() {
  const el = document.getElementById('body-runs');
  el.innerHTML = `
    <div id="runs" class="runs"><span class="lede">Loading…</span></div>
    <label>New run id</label>
    <form class="inline" id="create-form">
     <input id="new-run-id" placeholder="e.g. my-other-project" pattern="[A-Za-z0-9_\\-]+" required>
     <button type="submit">+</button>
    </form>
    <div id="create-status" class="status-line"></div>
  `;
  document.getElementById('create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('create-status');
    const run_id = document.getElementById('new-run-id').value.trim();
    status.textContent = 'Creating…'; status.className = 'status-line';
    try {
      await fetchJSON(`${API}/runs`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ run_id })
      });
      status.textContent = `Created ${run_id}.`; status.className = 'status-line ok';
      document.getElementById('new-run-id').value = '';
      await selectRun(run_id);
    } catch (err) {
      status.textContent = err.message; status.className = 'status-line err';
    }
  });
  await refreshRunsList();
}

async function refreshRunsList() {
  const el = document.getElementById('runs');
  try {
    const runs = await fetchJSON(`${API}/runs`);
    if (!runs.length) {
      el.innerHTML = '<span class="lede">No runs yet -- create one below.</span>';
      return;
    }
    el.innerHTML = '';
    for (const r of runs) {
      const btn = document.createElement('button');
      btn.className = 'run-item' + (r.run_id === currentRun ? ' active' : '');
      // Most urgent signal wins, one badge at a glance rather than a pile-up:
      // needs_attention (close to abort/overdue check-in) outranks a stalled
      // stage, which outranks a mechanical preflight risk finding.
      let badge = '';
      if (r.needs_attention) badge = `<span class="attention-badge">⚠ needs attention</span>`;
      else if (r.stalled_stages && r.stalled_stages.length) badge = `<span class="stalled-badge">${r.stalled_stages.length} stalled</span>`;
      else if (r.risk_count) badge = `<span class="risk-badge">${r.risk_count} risk(s)</span>`;
      btn.innerHTML = `${r.run_id}${badge}<div class="meta">${r.iterations} iteration(s) · ${r.roles} role(s)</div>`;
      btn.onclick = () => selectRun(r.run_id);
      el.appendChild(btn);
    }
  } catch (e) {
    el.innerHTML = `<span class="status-line err">${e.message}</span>`;
  }
}

async function selectRun(id) {
  currentRun = id;
  await refreshRunsList();
  for (const panelId of ['roles', 'healthcrit', 'risks', 'newiter', 'history']) {
    document.getElementById(`body-${panelId}`).innerHTML = '<span class="lede">Loading…</span>';
  }
  try {
    const data = await fetchJSON(`${API}/runs/${encodeURIComponent(id)}`);
    currentRunData = data;
    renderRolesPanel(data);
    renderHealthCriteriaPanel(id, data);
    renderRisksPanel(data);
    renderNewIterationPanel(id, data);
    renderHistoryPanel(data);
    document.getElementById('body-checkin').innerHTML = `<button class="secondary" id="view-checkin">View check-in</button><div id="checkin-view"></div>`;
    document.getElementById('view-checkin').onclick = () => viewCheckin(id);
    document.getElementById('body-memory').innerHTML = `<button class="secondary" id="view-memory">View memory log</button><div id="memory-view"></div>`;
    document.getElementById('view-memory').onclick = () => viewMemory(id);
  } catch (e) {
    for (const panelId of ['roles', 'healthcrit', 'risks', 'newiter', 'history']) {
      document.getElementById(`body-${panelId}`).innerHTML = `<span class="status-line err">${e.message}</span>`;
    }
  }
}

function placeholderIfNoRun(panelId) {
  const el = document.getElementById(`body-${panelId}`);
  if (!currentRun) { el.innerHTML = '<span class="lede">Select a run in the Runs panel.</span>'; return true; }
  return false;
}

// Real per-role status view (operator feedback: "die einzelnen Rollen sehen, was
// sie gerade machen, was ihre Ergebnisse gerade sind") -- for each role in the
// live spec, shows its most recent real iteration (stage/feedback/outcome), not
// a fabricated "currently running" state the async iterate-then-checkin
// architecture doesn't actually have. Role-filler identity/host isn't tracked
// anywhere in the data model yet -- said plainly rather than invented.
function renderRolesPanel(data) {
  const body = document.getElementById('body-roles');
  const history = data.state.history;
  const cards = data.spec.roles.map(r => {
    const stageId = r.service && r.service.Custom;
    const roleHistory = history.filter(h => h.stage === stageId);
    const latest = roleHistory[roleHistory.length - 1];
    const policy = r.selection_policy || data.spec.selection_policy || 'default';
    const latestHtml = latest
      ? `<div class="role-latest ${latest.succeeded ? 'ok' : 'fail'}">
           iteration ${latest.iteration} (${latest.succeeded ? 'ok' : 'FAILED'}): ${escapeHtml(truncate(latest.feedback, 160))}
         </div>`
      : `<div class="role-latest lede">no iteration yet for this role</div>`;
    return `<div class="role-card">
      <div class="role-card-head">
        <span class="role">${escapeHtml(r.tag)}</span>
        <span class="role-meta">${escapeHtml(stageId)} · units ${r.units} · policy ${escapeHtml(String(policy))}</span>
      </div>
      ${latestHtml}
      <div class="role-count lede">${roleHistory.length} iteration(s) total for this role</div>
    </div>`;
  }).join('');
  body.innerHTML = `${cards}
    <div class="lede" style="font-size:.72rem;margin-top:.4rem">
      Role-filler identity/host isn't tracked yet -- only the service name and
      auction selection policy are real data today. Flagged for a future
      increment, not fabricated here.
    </div>`;
}

function renderHealthCriteriaPanel(id, data) {
  const body = document.getElementById('body-healthcrit');
  const h = data.health;
  if (!h) { body.innerHTML = '<span class="lede">No health data.</span>'; return; }
  body.innerHTML = `
    <div class="health">
      <span class="stat${h.consecutive_failures >= h.criteria.max_consecutive_failures - 1 ? ' danger' : ''}">
        consecutive failures: <b>${h.consecutive_failures}</b> / ${h.criteria.max_consecutive_failures}</span>
      <span class="stat${h.iterations_until_checkin <= 1 ? ' warn' : ''}">
        next check-in in: <b>${h.iterations_until_checkin}</b> iteration(s)</span>
      <span class="stat${h.iterations_until_ceiling <= 2 ? ' danger' : ''}">
        iterations: <b>${h.iterations_completed}</b> / ${h.criteria.max_iterations}</span>
    </div>
    <details class="criteria" ${criteriaOpen ? 'open' : ''}>
      <summary>customize this run's bounded-loop criteria</summary>
      <div class="criteria-fields">
        <label>max iterations
          <input id="cr-max-iterations" type="number" min="1" value="${h.criteria.max_iterations}"></label>
        <label>max consecutive failures
          <input id="cr-max-failures" type="number" min="1" value="${h.criteria.max_consecutive_failures}"></label>
        <label>check-in every N iterations (0 = never)
          <input id="cr-checkin-every" type="number" min="0" value="${h.criteria.checkin_every}"></label>
      </div>
      <button type="button" class="secondary" id="save-criteria" style="margin-top:.5rem">Save criteria</button>
      <div id="criteria-status" class="status-line"></div>
    </details>
  `;
  document.getElementById('save-criteria').onclick = () => saveCriteria(id);
  const criteriaEl = body.querySelector('details.criteria');
  criteriaEl.ontoggle = (e) => { criteriaOpen = e.target.open; };
}

function renderRisksPanel(data) {
  const body = document.getElementById('body-risks');
  const risks = data.risks || [];
  const riskPanel = risks.length ? `
    <div class="risk-panel">
      <div class="title">⚠ ${risks.length} preflight risk finding(s)</div>
      Mechanical checks over this run's history, not an LLM guess:
      ${risks.map(r => `<div class="risk-item"><b>${escapeHtml(r.label)}</b> -- ${escapeHtml(r.evidence)}</div>`).join('')}
    </div>` : '';

  const stalled = data.stalled_stages || [];
  const stalledPanel = stalled.length ? `
    <div class="stalled-panel">
      <div class="title">⚠ ${stalled.length} stalled stage(s)</div>
      Proposed and live in the spec, but no iteration has ever run <em>as</em> these stages --
      likely blocked on a pending decision:
      <div style="margin-top:.3rem">${stalled.map(s =>
        `<button type="button" class="role stalled-fill" data-stage="${escapeHtml(s)}" title="Use this stage for the iteration below">${escapeHtml(s)}</button>`
      ).join(' ')}</div>
    </div>` : '';

  body.innerHTML = (riskPanel + stalledPanel) || '<span class="lede">Nothing flagged right now.</span>';
  for (const btn of body.querySelectorAll('.stalled-fill')) {
    btn.onclick = () => {
      const stageInput = document.getElementById('it-stage');
      if (stageInput) { stageInput.value = btn.dataset.stage; stageInput.focus(); }
    };
  }
}

function renderNewIterationPanel(id, data) {
  const body = document.getElementById('body-newiter');
  const stageOptions = data.spec.roles
    .map(r => r.service && r.service.Custom)
    .filter(Boolean)
    .map(s => `<option value="${escapeHtml(s)}">`)
    .join('');
  body.innerHTML = `
    <label>Stage (pick from this run's live roles, or type a new one)</label>
    <input id="it-stage" list="it-stage-list" value="devsystem.implement">
    <datalist id="it-stage-list">${stageOptions}</datalist>
    <label>Feedback (what this stage found)</label>
    <textarea id="it-feedback" placeholder="Real, honest account of what happened this iteration…"></textarea>
    <label><input type="checkbox" id="it-succeeded" checked style="width:auto"> succeeded</label>

    <label style="margin-top:1rem"><input type="checkbox" id="it-has-proposal" style="width:auto">
      Propose a new stage (the pipeline's self-optimization mechanic -- this actually grows the
      live spec, the same way a role-filler's own proposal would)</label>
    <div id="proposal-fields" style="display:none;margin-top:.4rem;padding:.6rem .7rem;
         border:1px dashed var(--border);border-radius:8px">
      <label>New stage id (e.g. <code>devsystem.android_emulator_test</code>)</label>
      <input id="pr-stage-id">
      <label>Tag (short name, e.g. <code>android_emulator_test</code>)</label>
      <input id="pr-tag">
      <label>Rationale -- why this stage is needed</label>
      <textarea id="pr-rationale" placeholder="What real need does this close?"></textarea>
      <label>Existing service to reuse (leave blank if a new one must be built)</label>
      <input id="pr-existing-service" placeholder="optional">
      <label>Units</label>
      <input id="pr-units" type="number" min="1" value="1">
      <label>Price ceiling (leave blank for none -- preflight will flag that)</label>
      <input id="pr-price-ceiling" type="number" min="0" placeholder="optional">
    </div>

    <div style="margin-top:.6rem;display:flex;gap:.5rem">
      <button id="submit-iter">Submit iteration</button>
    </div>
    <div id="iter-status" class="status-line"></div>
  `;
  document.getElementById('submit-iter').onclick = () => submitIteration(id);
  document.getElementById('it-has-proposal').onchange = (e) => {
    document.getElementById('proposal-fields').style.display = e.target.checked ? 'block' : 'none';
  };
}

function renderHistoryPanel(data) {
  const body = document.getElementById('body-history');
  const history = [...data.state.history].reverse().map(h => `
    <div class="iter">
      <div class="head"><span>iteration ${h.iteration} · ${h.stage}</span>
        <span class="${h.succeeded ? 'ok' : 'fail'}">${h.succeeded ? 'ok' : 'FAILED'}</span></div>
      <div>${escapeHtml(h.feedback)}</div>
      ${renderProposals(h.proposals)}
    </div>`).join('') || '<span class="lede">No iterations yet.</span>';
  body.innerHTML = `<div class="history">${history}</div>`;
}

async function submitIteration(id) {
  const status = document.getElementById('iter-status');
  const stage = document.getElementById('it-stage').value;
  const feedback = document.getElementById('it-feedback').value.trim();
  const succeeded = document.getElementById('it-succeeded').checked;
  if (!feedback) { status.textContent = 'Feedback is required.'; status.className = 'status-line err'; return; }

  const proposals = [];
  if (document.getElementById('it-has-proposal').checked) {
    const stageId = document.getElementById('pr-stage-id').value.trim();
    const tag = document.getElementById('pr-tag').value.trim();
    const rationale = document.getElementById('pr-rationale').value.trim();
    if (!stageId || !tag || !rationale) {
      status.textContent = 'A proposal needs a stage id, tag, and rationale.';
      status.className = 'status-line err';
      return;
    }
    const existingService = document.getElementById('pr-existing-service').value.trim();
    const priceCeiling = document.getElementById('pr-price-ceiling').value.trim();
    proposals.push({
      proposed_by: stage,
      stage_id: stageId,
      tag,
      rationale,
      use_existing_service: existingService || null,
      units: parseInt(document.getElementById('pr-units').value, 10) || 1,
      price_ceiling: priceCeiling ? parseInt(priceCeiling, 10) : null,
    });
  }

  status.textContent = 'Submitting…'; status.className = 'status-line';
  try {
    const result = await fetchJSON(`${API}/runs/${encodeURIComponent(id)}/iterate`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ stage, feedback, succeeded, proposals })
    });
    let text, cls, showCheckin = false;
    if (result.outcome === 'CheckinDue') {
      text = `Iteration ${result.iteration} recorded -- CHECK-IN REQUIRED (the bounded-loop cadence just fired). ` +
        `No further iterations should run on this stage until a human reviews the check-in below.`;
      cls = 'status-line warn';
      showCheckin = true;
    } else if (result.outcome === 'Abort') {
      text = `Iteration ${result.iteration} recorded -- RUN ABORTED (too many consecutive failures, or the ` +
        `iteration ceiling was reached). This run should not continue unsupervised.`;
      cls = 'status-line err';
    } else {
      text = `Iteration ${result.iteration} recorded -- outcome: ${result.outcome}, roles now ${result.roles_now}.`;
      cls = 'status-line ok';
    }
    // selectRun() re-renders every panel (fresh #iter-status included) -- set
    // the message on the element AFTER that render, not the stale reference
    // captured before it, or it gets wiped immediately.
    await selectRun(id);
    const freshStatus = document.getElementById('iter-status');
    freshStatus.textContent = text;
    freshStatus.className = cls;
    if (showCheckin) {
      showPanel('checkin');
      await viewCheckin(id);
    }
  } catch (e) {
    status.textContent = e.message; status.className = 'status-line err';
  }
}

async function saveCriteria(id) {
  const status = document.getElementById('criteria-status');
  const max_iterations = parseInt(document.getElementById('cr-max-iterations').value, 10);
  const max_consecutive_failures = parseInt(document.getElementById('cr-max-failures').value, 10);
  const checkin_every = parseInt(document.getElementById('cr-checkin-every').value, 10);
  if (!Number.isInteger(max_iterations) || !Number.isInteger(max_consecutive_failures) || !Number.isInteger(checkin_every)) {
    status.textContent = 'All three fields must be whole numbers.'; status.className = 'status-line err'; return;
  }
  status.textContent = 'Saving…'; status.className = 'status-line';
  try {
    await fetchJSON(`${API}/runs/${encodeURIComponent(id)}/criteria`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ max_iterations, max_consecutive_failures, checkin_every })
    });
    await selectRun(id);
    const fresh = document.getElementById('criteria-status');
    fresh.textContent = 'Saved.'; fresh.className = 'status-line ok';
  } catch (e) {
    status.textContent = e.message; status.className = 'status-line err';
  }
}

async function viewCheckin(id) {
  const view = document.getElementById('checkin-view');
  view.innerHTML = '<span class="lede">Loading…</span>';
  try {
    const data = await fetchJSON(`${API}/runs/${encodeURIComponent(id)}/checkin`);
    view.innerHTML = `<pre class="checkin">${escapeHtml(data.markdown)}</pre>`;
  } catch (e) {
    view.innerHTML = `<span class="status-line err">${e.message}</span>`;
  }
}

async function viewMemory(id) {
  const view = document.getElementById('memory-view');
  view.innerHTML = '<span class="lede">Loading…</span>';
  try {
    const entries = await fetchJSON(`${API}/runs/${encodeURIComponent(id)}/memory`);
    if (!entries.length) {
      view.innerHTML = '<span class="lede">No memory entries yet -- devsystem.remember writes one per iteration.</span>';
      return;
    }
    view.innerHTML = `<div class="memory-list">${entries.map(renderMemoryEntry).join('')}</div>`;
    for (const btn of view.querySelectorAll('.govern-entry')) {
      btn.onclick = () => governMemoryEntry(id, parseInt(btn.dataset.index, 10));
    }
  } catch (e) {
    view.innerHTML = `<span class="status-line err">${e.message}</span>`;
  }
}

async function governMemoryEntry(id, index) {
  try {
    await fetchJSON(`${API}/runs/${encodeURIComponent(id)}/memory/${index}/govern`, { method: 'POST' });
    await viewMemory(id);
  } catch (e) {
    const view = document.getElementById('memory-view');
    view.insertAdjacentHTML('afterbegin', `<div class="status-line err">${escapeHtml(e.message)}</div>`);
  }
}

function renderMemoryEntry(e, index) {
  const findings = e.envelope.key_findings.map(f => `<li>${escapeHtml(f)}</li>`).join('');
  const constraints = e.envelope.constraints.length
    ? `<div style="margin-top:.3rem;color:var(--muted)">constraints: <ul>${e.envelope.constraints.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul></div>`
    : '';
  const governBtn = e.trust === 'unreviewed'
    ? `<button type="button" class="secondary govern-entry" data-index="${index}" style="padding:.1rem .5rem;font-size:.68rem">mark reviewed</button>`
    : '';
  return `<div class="mem-entry">
    <div class="head">
      <span>${escapeHtml(e.stage)} · role ${escapeHtml(e.role)}</span>
      <span style="display:flex;align-items:center;gap:.4rem">
        <span class="trust ${e.trust}">${e.trust}</span>
        ${governBtn}
      </span>
    </div>
    <ul>${findings}</ul>
    ${constraints}
  </div>`;
}

function renderProposals(proposals) {
  if (!proposals || !proposals.length) return '';
  return proposals.map(p => {
    const reuse = p.use_existing_service
      ? `reuses <code>${escapeHtml(p.use_existing_service)}</code>`
      : 'needs a new service';
    const price = (p.price_ceiling === null || p.price_ceiling === undefined)
      ? '<span class="fail">no price ceiling</span>'
      : `price ceiling ${p.price_ceiling}`;
    return `<div class="proposal">
      <div class="proposal-head">→ proposed <code>${escapeHtml(p.stage_id)}</code> (${escapeHtml(p.tag)}), ${reuse}, ${price}</div>
      <div class="proposal-rationale">${escapeHtml(p.rationale)}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

initPanels();
loadRuns();
for (const id of ['roles', 'healthcrit', 'risks', 'newiter', 'history', 'checkin', 'memory']) {
  placeholderIfNoRun(id);
}
</script>
</body>
</html>
