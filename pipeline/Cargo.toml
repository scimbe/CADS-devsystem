[package]
name = "devsystem-pipeline"
version = "0.1.0"
edition = "2021"
description = "The Development System's PipelineSpec: seven stages (plan/test/implement/review/verify/remember/improve) declared as CADS-Tunnel crew-auction roles, generalized via ServiceType::Custom (#382)."

[dependencies]
# Pinned to the tag that shipped ServiceType::Custom -- the whole point of this
# crate: no CADS-Tunnel core release is needed for a new pipeline-stage type,
# only a new Custom name declared here.
ct-common = { git = "https://github.com/scimbe/CADS-Tunnel", tag = "v0.4.13" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# devsystem_offer only -- the minimal real "agent" binary: signs a real
# CapacityOffer and POSTs it to a devsystem-web instance's /offers/submit over
# plain HTTP, so it can run on any host with network access, never co-located
# with devsystem-web (#382 operator directive: every component must be able to
# run on a different host, connected only by real channels/network calls).
# Same rustls-backed, no-default-features shape CADS-Tunnel's own crates use.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rand = "0.8"
# devsystem_assistant --serve only -- a minimal, synchronous HTTP server so the
# GUI can call the assistant over the same real logic the one-shot CLI uses.
# Deliberately not axum/tokio (already web/'s job): this bridge is meant to run
# co-located with a real LLM CLI, possibly a different host than devsystem-web
# itself, and processes one request at a time by design (each request already
# takes several real seconds for the LLM call -- serialized handling is a
# feature here, not a limitation, it caps concurrent LLM spend).
tiny_http = "0.12"

